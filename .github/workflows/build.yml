name: Build BDRSF Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout source code
        uses: actions/checkout@v4

      - name: 2. Inspect repository structure (Debug Info)
        run: |
          echo "=== Repository Files ==="
          ls -la
          echo "=== Checking Gradle Wrapper ==="
          if [ -f "./gradlew" ]; then
            echo "gradlew found!"
          else
            echo "WARNING: gradlew NOT found! Will use system Gradle 8.9."
          fi

      - name: 3. Clean up ALL old Artifacts & old Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Cleaning old workflow artifacts..."
          ARTIFACT_IDS=$(gh api "repos/${{ github.repository }}/actions/artifacts" --jq '.artifacts[].id' 2>/dev/null || true)
          for id in $ARTIFACT_IDS; do
            echo "Deleting old artifact ID: $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" >/dev/null 2>&1 || true
          done

          echo "Cleaning old debug-latest release..."
          if gh release view debug-latest >/dev/null 2>&1; then
            gh release delete debug-latest --yes --cleanup-tag || true
          fi

      - name: 4. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 6. Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug --stacktrace
          else
            gradle --no-daemon assembleDebug --stacktrace
          fi

      - name: 7. Locate & Rename APK
        run: |
          APK_PATH=$(find . -path "*/build/outputs/apk/debug/*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ ERROR: APK build finished but no .apk file was generated!"
            find . -name "*.apk" -type f || true
            exit 1
          fi
          echo "✅ Found APK at: $APK_PATH"
          cp "$APK_PATH" BDRSF-Android-debug.apk
          ls -lh BDRSF-Android-debug.apk

      - name: 8. Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BDRSF-Android-debug
          path: BDRSF-Android-debug.apk
          if-no-files-found: error
          retention-days: 5

      - name: 9. Create Fresh GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create debug-latest BDRSF-Android-debug.apk \
            --title "BDRSF-Android Latest Debug APK" \
            --notes "Fresh automated build from commit ${{ github.sha }}" \
            --prerelease
