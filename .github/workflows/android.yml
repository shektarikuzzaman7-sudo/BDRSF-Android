name: BDRSF Android CI & Latest Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle fallback
        uses: gradle/setup-gradle@v4

      - name: Build Debug APK
        run: |
          GRADLEW_PATH=$(find . -maxdepth 3 -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            echo "Found gradlew at: $GRADLEW_PATH"
            chmod +x "$GRADLEW_PATH"
            (cd "$PROJECT_DIR" && ./gradlew assembleDebug)
          else
            echo "gradlew not found, using system gradle..."
            APP_BUILD=$(find . -maxdepth 3 -path "*/app/build.gradle*" -type f | head -n 1)
            if [ -n "$APP_BUILD" ]; then
              PROJECT_DIR=$(dirname "$(dirname "$APP_BUILD")")
              (cd "$PROJECT_DIR" && gradle assembleDebug)
            else
              gradle assembleDebug
            fi
          fi

      - name: Prepare final APK
        run: |
          APK_PATH=$(find . -path "*/app/build/outputs/apk/debug/*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Debug APK not found!"
            exit 1
          fi
          cp "$APK_PATH" BDRSF-Android-debug.apk
          ls -lh BDRSF-Android-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BDRSF-Android-debug-apk
          path: BDRSF-Android-debug.apk
          if-no-files-found: error

      - name: Ensure debug-latest release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view debug-latest >/dev/null 2>&1; then
            gh release create debug-latest \
              --title "Debug Latest" \
              --notes "Latest automated debug build for BDRSF-Android"
          fi

      - name: Overwrite latest APK in debug-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload debug-latest BDRSF-Android-debug.apk --clobber
          gh release edit debug-latest \
            --title "Debug Latest" \
            --notes "Latest automated debug build for BDRSF-Android | Commit: ${{ github.sha }} | Run: #${{ github.run_number }}"
