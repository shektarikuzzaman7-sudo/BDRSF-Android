name: Build BDRSF Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Clean up old workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_IDS=$(gh api "repos/${{ github.repository }}/actions/artifacts" --jq '.artifacts[].id' || true)
          for id in $ARTIFACT_IDS; do
            echo "Deleting old artifact ID: $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Check Gradle version
        run: ./gradlew --version

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Locate and prepare APK
        id: apk
        run: |
          APK_PATH=$(find . -path "*/build/outputs/apk/debug/*.apk" -type f | head -n 1)
          echo "Found APK: $APK_PATH"
          if [ -z "$APK_PATH" ]; then
            echo "Error: No debug APK found in repository!"
            find . -name "*.apk" -type f || true
            exit 1
          fi
          cp "$APK_PATH" BDRSF-Android-debug.apk
          ls -lh BDRSF-Android-debug.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BDRSF-Android-debug-APK
          path: BDRSF-Android-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view debug-latest >/dev/null 2>&1; then
            gh release upload debug-latest BDRSF-Android-debug.apk --clobber
            gh release edit debug-latest \
              --title "BDRSF-Android Latest Debug APK" \
              --notes "Automated debug build from commit ${{ github.sha }} ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          else
            gh release create debug-latest BDRSF-Android-debug.apk \
              --title "BDRSF-Android Latest Debug APK" \
              --notes "Automated debug build from commit ${{ github.sha }} ($(date -u '+%Y-%m-%d %H:%M UTC'))" \
              --prerelease
          fi
