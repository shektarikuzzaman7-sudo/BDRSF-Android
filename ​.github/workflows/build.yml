# File: .github/workflows/build.yml
name: Build BDRSF Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Clean up old workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_IDS=$(gh api "repos/${{ github.repository }}/actions/artifacts" --jq '.artifacts[].id')
          for id in $ARTIFACT_IDS; do
            echo "Deleting old artifact ID: $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Gradle version
        run: gradle --version

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Publish APK to GitHub Release (Instant Download)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_FILE=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "APK file not found!"
            exit 1
          fi
          cp "$APK_FILE" BDRSF-Android-debug.apk
          if gh release view debug-latest >/dev/null 2>&1; then
            gh release upload debug-latest BDRSF-Android-debug.apk --clobber
          else
            gh release create debug-latest BDRSF-Android-debug.apk \
              --title "BDRSF-Android Latest Debug APK" \
              --notes "Automated debug build from commit ${{ github.sha }}" \
              --prerelease
          fi

      - name: Upload APK artifact if quota available
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: BDRSF-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
          if-no-files-found: error
